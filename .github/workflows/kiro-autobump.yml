name: Kiro Version Autobump

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest kiro release
        id: latest
        run: |
          version=$(curl -fsSL https://desktop-release.q.us-east-1.amazonaws.com/latest/manifest.json | python3 -c 'import sys,json; print(json.load(sys.stdin)["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Latest kiro version: $version"

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "v${{ steps.latest.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push version tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.latest.outputs.version }}"
          git push origin "v${{ steps.latest.outputs.version }}"
