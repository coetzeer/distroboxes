name: Commandcode Version Autobump

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest commandcode version
        id: latest
        run: |
          version=$(curl -fsSL https://registry.npmjs.org/command-code/latest | jq -r '.version')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Could not determine the latest commandcode version from npm"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Latest commandcode version: $version"

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "v${{ steps.latest.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push version tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.latest.outputs.version }}"
          git push origin "v${{ steps.latest.outputs.version }}"

      - name: Trigger container build
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run commandcode-container.yml --ref "v${{ steps.latest.outputs.version }}"
